<style>
  .viz-root {
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --series-1: #2a78d6;
    --series-1-soft: rgba(42,120,214,0.14);
    --border: rgba(11,11,11,0.10);
    --good: #006300;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text-primary);
    margin: 1.5em 0;
  }
  /* segue lo schema scuro (slate) di MkDocs Material */
  [data-md-color-scheme="slate"] .viz-root {
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --series-1: #3987e5;
    --series-1-soft: rgba(57,135,229,0.20);
    --border: rgba(255,255,255,0.10);
    --good: #0ca30c;
  }
  .viz-root .wrap { max-width: 860px; margin: 0 auto; }
  .viz-root .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 24px 12px;
  }
  .viz-root h1 { font-size: 20px; font-weight: 650; margin: 0 0 2px; letter-spacing: -0.01em; color: var(--text-primary) !important; }
  .viz-root .sub { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }
  .viz-root .stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 0 0 18px; }
  .viz-root .stat .v { font-size: 30px; font-weight: 680; line-height: 1; letter-spacing: -0.02em; }
  .viz-root .stat .v.good { color: var(--good); }
  .viz-root .stat .k { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .viz-root .chart { position: relative; width: 100%; }
  .viz-root svg { display: block; width: 100%; height: auto; overflow: visible; }
  .viz-root .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .viz-root .axis-title { fill: var(--text-secondary); font-size: 12px; }
  .viz-root .end-label { fill: var(--series-1); font-size: 13px; font-weight: 650; }
  .viz-root .tip {
    position: absolute; pointer-events: none; opacity: 0;
    transform: translate(-50%, -115%); transition: opacity .08s;
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 9px; padding: 7px 10px; font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.14); white-space: nowrap; z-index: 3;
  }
  .viz-root .tip .t-user { font-weight: 640; }
  .viz-root .tip .t-meta { color: var(--text-secondary); margin-top: 2px; }
  .viz-root .foot { font-size: 11px; color: var(--muted); margin: 14px 2px 4px; }
</style>

        <svg id="chart" viewBox="0 0 820 340" role="img" aria-label="Grafico cumulativo dei voti favorevoli nel tempo"></svg>
        <div class="tip" id="tip"></div>

      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>
const DATA = [{"t":"2026-07-14T08:59:17.260Z","c":1,"u":"andyborruso","n":2},{"t":"2026-07-14T09:00:50.000Z","c":2,"u":"gianofe","n":3},{"t":"2026-07-14T09:07:04.000Z","c":3,"u":"Aldo_Gessa","n":4},{"t":"2026-07-14T09:12:06.256Z","c":4,"u":"Lu_Bar","n":5},{"t":"2026-07-14T09:25:38.000Z","c":5,"u":"Codato","n":6},{"t":"2026-07-14T09:27:59.000Z","c":6,"u":"ACorradini","n":7},{"t":"2026-07-14T09:32:18.000Z","c":7,"u":"Genna","n":8},{"t":"2026-07-14T09:37:34.797Z","c":8,"u":"GISspecialistAlejand","n":9},{"t":"2026-07-14T09:39:00.715Z","c":9,"u":"ValPinnaSardinia","n":10},{"t":"2026-07-14T09:46:28.000Z","c":10,"u":"Bianca_Federici","n":11},{"t":"2026-07-14T09:56:22.160Z","c":11,"u":"manoloterranova","n":12},{"t":"2026-07-14T10:04:00.377Z","c":12,"u":"piergiorgio-roveda","n":13},{"t":"2026-07-14T10:06:00.000Z","c":13,"u":"Sabrina_Casucci","n":14},{"t":"2026-07-14T10:08:17.966Z","c":14,"u":"sino87","n":15},{"t":"2026-07-14T10:32:12.143Z","c":15,"u":"MarcoTagliabue","n":16},{"t":"2026-07-14T10:47:47.221Z","c":16,"u":"Amefad","n":17},{"t":"2026-07-14T11:06:37.000Z","c":17,"u":"GiPi48","n":18},{"t":"2026-07-14T11:23:29.703Z","c":18,"u":"Carlo","n":19},{"t":"2026-07-14T11:30:41.000Z","c":19,"u":"Roberto_Bezzu","n":20},{"t":"2026-07-14T11:37:34.000Z","c":20,"u":"Umberto_Zulian1","n":21},{"t":"2026-07-14T11:42:01.000Z","c":21,"u":"christian_loda","n":22},{"t":"2026-07-14T12:09:18.000Z","c":22,"u":"rmarzocchi84","n":23},{"t":"2026-07-14T12:14:00.000Z","c":23,"u":"e111","n":24},{"t":"2026-07-14T12:50:00.201Z","c":24,"u":"corfede","n":25},{"t":"2026-07-14T13:40:17.233Z","c":25,"u":"lucalant","n":26},{"t":"2026-07-14T13:51:35.000Z","c":26,"u":"Ludovico","n":27},{"t":"2026-07-14T14:50:11.783Z","c":27,"u":"albertograva","n":28},{"t":"2026-07-14T14:58:26.136Z","c":28,"u":"ClaudioLadisaPK","n":29},{"t":"2026-07-14T14:58:59.000Z","c":29,"u":"Giuseppe_Mattiozzi","n":30},{"t":"2026-07-14T15:02:45.000Z","c":30,"u":"giacomo_amerio","n":31},{"t":"2026-07-14T15:13:20.000Z","c":31,"u":"Marco_Masciarelli","n":32},{"t":"2026-07-14T15:21:12.000Z","c":32,"u":"Iacopo_Zetti","n":33},{"t":"2026-07-14T15:22:03.000Z","c":33,"u":"Massimiliano_Flamign","n":34},{"t":"2026-07-14T15:24:05.068Z","c":34,"u":"Korto191","n":35},{"t":"2026-07-14T15:27:42.603Z","c":35,"u":"Beg","n":36},{"t":"2026-07-14T15:32:35.714Z","c":36,"u":"gbvitrano","n":37},{"t":"2026-07-14T15:40:31.000Z","c":37,"u":"Simone_Barbarotti","n":38},{"t":"2026-07-14T16:36:16.863Z","c":38,"u":"GEPO","n":39},{"t":"2026-07-14T16:36:23.120Z","c":39,"u":"l.gattiglia","n":40},{"t":"2026-07-14T16:54:08.818Z","c":40,"u":"adelchia","n":41},{"t":"2026-07-14T16:58:17.000Z","c":41,"u":"Giuliano.urgeghe","n":42},{"t":"2026-07-14T20:47:07.223Z","c":42,"u":"Dario","n":43},{"t":"2026-07-15T05:53:32.736Z","c":43,"u":"albertograva","n":44},{"t":"2026-07-15T06:01:48.225Z","c":44,"u":"RobiFag","n":45},{"t":"2026-07-15T06:30:54.741Z","c":45,"u":"Marco.1","n":46},{"t":"2026-07-15T07:31:48.761Z","c":46,"u":"falcesimo","n":47},{"t":"2026-07-15T08:13:42.000Z","c":47,"u":"gpuddu","n":48},{"t":"2026-07-15T09:30:07.770Z","c":48,"u":"Dario_Saccoccia","n":49},{"t":"2026-07-15T10:21:25.552Z","c":49,"u":"mfodera","n":50},{"t":"2026-07-15T12:53:31.000Z","c":50,"u":"laser","n":51},{"t":"2026-07-15T22:24:16.512Z","c":51,"u":"christian.orlando","n":52},{"t":"2026-07-17T09:18:48.000Z","c":52,"u":"ACorradini","n":54},{"t":"2026-07-17T10:37:06.777Z","c":53,"u":"marco_126","n":56},{"t":"2026-07-17T14:10:54.000Z","c":54,"u":"Gabriela","n":57},{"t":"2026-07-20T12:33:25.983Z","c":55,"u":"skampus","n":58},{"t":"2026-07-21T05:31:18.114Z","c":56,"u":"agiudiceandrea","n":59},{"t":"2026-07-21T07:16:17.000Z","c":57,"u":"Paolo_Venturelli","n":60},{"t":"2026-07-21T08:19:50.795Z","c":58,"u":"VadoDeCorsa","n":61},{"t":"2026-07-21T17:22:21.536Z","c":59,"u":"dbrossella","n":62},{"t":"2026-07-22T11:30:45.594Z","c":60,"u":"Antoviscomi","n":63},{"t":"2026-07-22T12:08:03.815Z","c":61,"u":"Isma23","n":64}];

const W = 820, H = 340;
const M = { top: 20, right: 54, bottom: 44, left: 40 };
const iw = W - M.left - M.right, ih = H - M.top - M.bottom;

const pts = DATA.map(d => ({ x: new Date(d.t).getTime(), y: d.c, u: d.u, n: d.n }));
const x0 = pts[0].x, x1 = pts[pts.length-1].x;
const yMax = 70;
const sx = v => M.left + (v - x0) / (x1 - x0) * iw;
const sy = v => M.top + ih - (v / yMax) * ih;

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("chart");
const mk = (n, a) => { const e = document.createElementNS(svgNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };

// y gridlines
[0,10,20,30,40,50,60,70].forEach(v => {
  svg.appendChild(mk("line", { x1: M.left, x2: M.left+iw, y1: sy(v), y2: sy(v), stroke: "var(--grid)", "stroke-width": 1 }));
  const t = mk("text", { x: M.left-8, y: sy(v)+4, "text-anchor": "end", class: "tick" }); t.textContent = v; svg.appendChild(t);
});

// time helpers (CEST = UTC+2)
const fmt = ms => { const d = new Date(ms); const h = d.getUTCHours()+2; const hh = ((h%24)+24)%24;
  return String(hh).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); };
const fmtDay = ms => { const d = new Date(ms); const day = ((d.getUTCHours()+2)>=24 ? d.getUTCDate()+1 : d.getUTCDate()); return day+" lug"; };
// x axis: one label + bottom tick per day (14 → 21 lug), dashed separator at midnight CEST
for (let day = 14; day <= 22; day++) {
  const dayStart = new Date(Date.UTC(2026,6,day-1,22,0,0)).getTime(); // 00:00 CEST of `day`
  const dayEnd = new Date(Date.UTC(2026,6,day,22,0,0)).getTime();     // 00:00 CEST of next day
  const cS = Math.max(x0, dayStart), cE = Math.min(x1, dayEnd);
  if (cE < x0 || cS > x1) continue;
  // dashed separator at the day's start (skip first)
  if (day > 14) {
    const xs = sx(cS);
    svg.appendChild(mk("line", { x1: xs, x2: xs, y1: M.top, y2: M.top+ih, stroke: "var(--grid)", "stroke-width": 1, "stroke-dasharray": "3 4" }));
  }
  // day label centered over the day's visible span (top)
  const xMid = (sx(cS) + sx(cE)) / 2;
  const lb = mk("text", { x: xMid, y: M.top+13, "text-anchor": "middle", class: "axis-title", "font-weight": 600 }); lb.textContent = day+" lug"; svg.appendChild(lb);
  // bottom tick + label
  svg.appendChild(mk("line", { x1: xMid, x2: xMid, y1: M.top+ih, y2: M.top+ih+5, stroke: "var(--axis)", "stroke-width": 1 }));
  const bl = mk("text", { x: xMid, y: M.top+ih+18, "text-anchor": "middle", class: "tick" }); bl.textContent = String(day); svg.appendChild(bl);
}

// area + step line (cumulative → step)
let dLine = `M ${sx(pts[0].x)} ${sy(pts[0].y)}`;
for (let i=1;i<pts.length;i++){ dLine += ` L ${sx(pts[i].x)} ${sy(pts[i-1].y)} L ${sx(pts[i].x)} ${sy(pts[i].y)}`; }
const dArea = `${dLine} L ${sx(pts[pts.length-1].x)} ${sy(0)} L ${sx(pts[0].x)} ${sy(0)} Z`;
svg.appendChild(mk("path", { d: dArea, fill: "var(--series-1-soft)", stroke: "none" }));
svg.appendChild(mk("path", { d: dLine, fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));

// end marker + label
const last = pts[pts.length-1];
svg.appendChild(mk("circle", { cx: sx(last.x), cy: sy(last.y), r: 4.5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }));
const el = mk("text", { x: sx(last.x)-8, y: sy(last.y-9), "text-anchor": "end", class: "end-label" }); el.textContent = "61 voti"; svg.appendChild(el);

// axis title y
const yt = mk("text", { x: M.left-8, y: M.top-6, "text-anchor": "start", class: "axis-title" }); yt.textContent = "voti cumulati"; svg.appendChild(yt);

// hover
const tip = document.getElementById("tip");
const hv = mk("line", { x1:0,x2:0,y1:M.top,y2:M.top+ih, stroke:"var(--axis)","stroke-width":1, opacity:0 }); svg.appendChild(hv);
const hd = mk("circle", { r:5, fill:"var(--series-1)", stroke:"var(--surface-1)","stroke-width":2, opacity:0 }); svg.appendChild(hd);
const overlay = mk("rect", { x:M.left, y:M.top, width:iw, height:ih, fill:"transparent" }); svg.appendChild(overlay);

function nearest(px){ let best=0,bd=1e9; for(let i=0;i<pts.length;i++){ const d=Math.abs(sx(pts[i].x)-px); if(d<bd){bd=d;best=i;} } return best; }
overlay.addEventListener("mousemove", e => {
  const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width * W;
  const i = nearest(px); const p = pts[i];
  hv.setAttribute("x1", sx(p.x)); hv.setAttribute("x2", sx(p.x)); hv.setAttribute("opacity", 1);
  hd.setAttribute("cx", sx(p.x)); hd.setAttribute("cy", sy(p.y)); hd.setAttribute("opacity", 1);
  tip.style.opacity = 1;
  tip.style.left = (sx(p.x)/W*r.width) + "px";
  tip.style.top = (sy(p.y)/H*r.height) + "px";
  tip.innerHTML = `<div class="t-user">${p.y}° voto · @${p.u}</div><div class="t-meta">${fmtDay(p.x)} ${fmt(p.x)} · post #${p.n}</div>`;
});
overlay.addEventListener("mouseleave", () => { tip.style.opacity=0; hv.setAttribute("opacity",0); hd.setAttribute("opacity",0); });

document.getElementById("foot").textContent =
  "Primo voto 14 lug 10:59 · ultimo 22 lug 14:08 (CEST) · 42 voti nella prima giornata. Ultimo controllo 22/07/2026 15:23 (CEST) via API Discourse. Scadenza votazione 21 luglio 2026 (superata, voti ancora in arrivo).";
</script>

site_name: Academy QGIS by pigreco
site_author: Salvatore Fiandaca
site_url: "https://pigreco.github.io/academy_qgis_pigreco/"

use_directory_urls: false

# Copyright
copyright: <b>Ing. Salvatore Fiandaca</b> | 2026 | <a href="https://pigrecoinfinito.com//" target="_self" title="Chi Siamo" >About</a>

theme:
  name: material
  language: it
  font:
    text: "Ubuntu"  # Font per il testo
    code: "Courier"  # Font per il codice
  icon:
    logo: simple/qgis
    annotation: material/star-four-points-circle
  favicon: imgs/logo_pigrecoinfinito.png

  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch in nero
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch in bianco
    
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.share
    - navigation.footer
    - toc.follow
    - content.action.edit
    - content.action.view
    - content.code.copy


